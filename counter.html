<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터 앱</title>
  <!-- Tailwind CSS를 CDN(외부 서버)에서 불러옵니다. 별도 설치 없이 바로 클래스만 써서 스타일링할 수 있어요 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">

  <!-- 카운터 전체를 감싸는 카드(상자) -->
  <div class="bg-white rounded-2xl shadow-lg p-8 w-80 text-center">

    <h1 class="text-xl font-bold text-slate-700 mb-6">카운터 앱</h1>

    <!-- 현재 카운트를 보여주는 숫자. id="count"로 이름표를 붙여서 자바스크립트에서 찾아 쓸 수 있게 합니다 -->
    <p id="count" class="text-6xl font-extrabold text-blue-600 mb-8">0</p>

    <!-- 버튼 3개를 가로로 나란히 배치하는 영역 -->
    <div class="flex justify-center gap-3">
      <!-- onclick: 이 버튼을 클릭하면 뒤에 적힌 자바스크립트 함수를 실행하라는 뜻 -->
      <button onclick="decrease()"
        class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition">
        -1
      </button>

      <button onclick="reset()"
        class="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-2 px-4 rounded-lg transition">
        리셋
      </button>

      <button onclick="increase()"
        class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition">
        +1
      </button>
    </div>

  </div>

  <script>
    // 현재 카운트 값을 저장하는 변수. let으로 선언해서 값이 계속 바뀔 수 있게 합니다
    let count = 0;

    // 화면에 보이는 숫자를 실제 count 값으로 다시 그려주는 함수
    function updateDisplay() {
      document.getElementById('count').textContent = count;
    }

    // +1 버튼을 누르면 실행됨
    function increase() {
      count = count + 1;
      updateDisplay();
    }

    // -1 버튼을 누르면 실행됨
    function decrease() {
      count = count - 1;
      updateDisplay();
    }

    // 리셋 버튼을 누르면 실행됨
    function reset() {
      count = 0;
      updateDisplay();
    }
  </script>

</body>
</html>
